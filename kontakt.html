<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | InterWeb</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style1.css">
</head>
<body>
  <div class="moon" aria-hidden="true"></div>

  <nav>
    <a href="index.html">Home</a>
    <a href="teachable.html">The Watcher</a>
    <a href="kontakt.html">Contact</a>
  </nav>

  <header>
    <h1>Contact</h1>
    <p class="tagline">Write to me. I will reply before sunrise.</p>
  </header>

  <main>
    <!-- This form does not send anything yet; it needs a server to work. -->
    <form onsubmit="return false">
      <label>Your name
        <input type="text" name="name">
      </label>
      <label>Your message
        <textarea name="message" rows="6"></textarea>
      </label>
      <button type="submit">Send</button>
    </form>
  </main>

  <footer>
    Do not reply to messages that arrive down the chimney.
  </footer>
  <script src="js/music.js"></script>
</body>
</html>
